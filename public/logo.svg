<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>
  <!-- Subtle inner border -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#2a0a0a" stroke-width="1.5" opacity="0.4"/>

  <!-- Outer glow layer for the pipeline -->
  <g filter="url(#outerGlow)" opacity="0.4">
    <!-- Data pipeline — zigzag that subtly traces an M then curves into an O -->
    <path d="M100 320 L140 320 L180 180 L256 340 L332 180 L372 320 L412 320"
          fill="none" stroke="url(#glow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main pipeline flow line — the zigzag reads as M peaks -->
  <g filter="url(#neon)">
    <path d="M100 320 L140 320 L180 180 L256 340 L332 180 L372 320 L412 320"
          fill="none" stroke="url(#glow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Arch — curves over the M, subtly suggesting the O -->
  <g filter="url(#neon)">
    <path d="M140 140 Q256 70 372 140" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <!-- Left pillar -->
    <line x1="140" y1="140" x2="140" y2="370" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    <!-- Right pillar -->
    <line x1="372" y1="140" x2="372" y2="370" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Data nodes on the pipeline -->
  <circle cx="100" cy="320" r="7" fill="#ef4444" filter="url(#neon)"/>
  <circle cx="180" cy="180" r="6" fill="#dc2626" filter="url(#neon)"/>
  <circle cx="256" cy="340" r="6" fill="#ef4444" filter="url(#neon)"/>
  <circle cx="332" cy="180" r="6" fill="#dc2626" filter="url(#neon)"/>
  <circle cx="412" cy="320" r="7" fill="#ef4444" filter="url(#neon)"/>
</svg>
